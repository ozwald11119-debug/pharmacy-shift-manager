<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>17店舗シフト管理</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#223047;margin:0}header{background:white;padding:16px 4%;border-bottom:1px solid #ddd}main{max-width:1300px;margin:auto;padding:20px}section{background:white;border:1px solid #dce3ec;border-radius:12px;padding:18px;margin:12px 0}input,select,button{font:inherit;padding:9px;border:1px solid #ccd5e0;border-radius:7px;margin:4px}button{background:#215a9c;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}table{border-collapse:collapse;white-space:nowrap}td,th{border:1px solid #dce3ec;padding:5px;text-align:center}th:first-child{position:sticky;left:0;background:#fff}td input{width:100px;box-sizing:border-box;font-size:12px}td input[type=number]{width:60px}#grid{overflow:auto;max-height:70vh}small,.muted{color:#64748b}.error{color:#a22}#login{max-width:400px;margin:60px auto}#login input{display:block;width:90%}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style><header><b>薬局17店舗 シフト管理</b> <small>共有データベース版</small></header><main><section id="login"><h2>店舗ログイン</h2><p class="muted">発行された店舗アカウントでログインしてください。</p><input id="email" type="email" placeholder="メールアドレス" autocomplete="username"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="signin">ログイン</button><p id="loginmsg" class="error"></p></section><div id="app" hidden><div class="row"><label>店舗 <select id="store"></select></label><label>対象月 <input id="month" type="month"></label><button id="reload">更新</button><button id="csv">CSV出力</button><button id="logout">ログアウト</button></div><section><h2 id="heading"></h2><div class="row"><input id="staffname" placeholder="スタッフ名"><select id="role"><option>薬剤師</option><option>事務</option><option>その他</option></select><button id="add">スタッフ登録</button></div><p id="notice" role="status"></p><div id="grid"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://fgwowahsuxrtyrlbymeb.supabase.co','sb_publishable_SK56ZLzmq8OHKHM4WGnbrA_ELRETkgp');
const $=id=>document.getElementById(id);let account=null,stores=[],staff=[],shifts=[],revision=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('month').value=new Date().toLocaleDateString('sv-SE').slice(0,7);
function msg(t,bad=false){$('notice').textContent=t;$('notice').className=bad?'error':''}
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){$('login').hidden=false;$('app').hidden=true;return}const {data,error}=await db.from('store_accounts').select('store_id,is_admin').eq('user_id',user.id).single();if(error||!data){await db.auth.signOut();$('loginmsg').textContent='店舗アカウントが未登録です。管理者に連絡してください。';return}account=data;const result=await db.from('stores').select('id,name').order('name');if(result.error){$('loginmsg').textContent=result.error.message;return}stores=result.data;$('store').replaceChildren(...stores.map(s=>new Option(s.name,s.id)));if(account.store_id)$('store').value=account.store_id;$('login').hidden=true;$('app').hidden=false;await load()}
$('signin').onclick=async()=>{$('loginmsg').textContent='確認中…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginmsg').textContent=error?error.message:'';if(!error)await check()};
$('logout').onclick=async()=>{await db.auth.signOut();account=null;check()};
function editable(){return account&&(account.is_admin||account.store_id===$('store').value)}
async function load(){const v=++revision,store=$('store').value,month=$('month').value;if(!store||!month)return;msg('読み込み中…');const [a,b]=await Promise.all([db.from('staff').select('id,name,role').eq('store_id',store).eq('active',true).order('created_at'),db.from('shifts').select('id,staff_id,work_date,start_time,end_time,break_minutes,note,updated_at').eq('store_id',store).gte('work_date',month+'-01').lt('work_date',new Date(Number(month.slice(0,4)),Number(month.slice(5)),1).toLocaleDateString('sv-SE'))]);if(v!==revision)return;if(a.error||b.error){msg((a.error||b.error).message,true);return}staff=a.data;shifts=b.data;render();msg('共有データを表示中。変更は各入力欄を離れた時に保存されます。')}
function render(){const store=stores.find(s=>s.id===$('store').value),month=$('month').value,[y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate(),can=editable();$('heading').textContent=(store?.name||'')+' / '+y+'年'+m+'月';$('add').disabled=!can;$('staffname').disabled=!can;$('role').disabled=!can;const map=new Map(shifts.map(x=>[x.staff_id+'|'+x.work_date,x]));let h='<table><thead><tr><th>スタッフ</th>';for(let d=1;d<=days;d++)h+='<th>'+d+'日</th>';h+='<th>実働合計</th></tr></thead><tbody>';for(const s of staff){h+='<tr><th>'+esc(s.name)+'<small> '+esc(s.role)+'</small></th>';let sum=0;for(let d=1;d<=days;d++){const date=month+'-'+String(d).padStart(2,'0'),v=map.get(s.id+'|'+date),start=v?.start_time?.slice(0,5)||'',end=v?.end_time?.slice(0,5)||'',br=v?.break_minutes??60;const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};if(start&&end&&toMin(end)>=toMin(start)+br)sum+=toMin(end)-toMin(start)-br;h+='<td>'+['start_time','end_time','break_minutes'].map((f,i)=>'<input '+(!can?'disabled ':'')+'data-staff="'+s.id+'" data-date="'+date+'" data-field="'+f+'" type="'+(i===2?'number':'time')+'" '+(i===2?'min="0" max="1440"':'')+' value="'+esc([start,end,br][i])+'" aria-label="'+esc(s.name+' '+d+'日 '+f)+'">').join('')+'</td>'}h+='<td>'+ (sum/60).toFixed(2)+'h</td></tr>'}h+='</tbody></table>';$('grid').innerHTML=h}
$('grid').addEventListener('change',async e=>{const x=e.target;if(!x.dataset.field||!editable())return;const sid=x.dataset.staff,date=x.dataset.date;const old=shifts.find(s=>s.staff_id===sid&&s.work_date===date);const vals={start_time:old?.start_time?.slice(0,5)||null,end_time:old?.end_time?.slice(0,5)||null,break_minutes:old?.break_minutes??60};vals[x.dataset.field]=x.value||(x.dataset.field==='break_minutes'?0:null);vals.break_minutes=Number(vals.break_minutes);if((vals.start_time===null)!==(vals.end_time===null)){msg('開始と終了の両方を入力すると保存します。');return}if(vals.start_time&&vals.end_time&&vals.end_time<=vals.start_time){msg('終了時刻は開始時刻より後にしてください。',true);return}msg('保存中…');let q;if(old){q=db.from('shifts').update({...vals,updated_at:new Date().toISOString()}).eq('id',old.id).eq('updated_at',old.updated_at).select('id')}else{q=db.from('shifts').insert({...vals,staff_id:sid,store_id:$('store').value,work_date:date}).select('id')}const {data,error}=await q;if(error||!data?.length){msg(error?.message||'他の端末で更新されています。更新ボタンで最新データを確認してください。',true);return}await load()});
$('add').onclick=async()=>{if(!editable())return;const name=$('staffname').value.trim();if(!name)return;const {error}=await db.from('staff').insert({name,role:$('role').value,store_id:$('store').value});if(error){msg(error.message,true);return}$('staffname').value='';await load()};
$('store').onchange=load;$('month').onchange=load;$('reload').onclick=load;
$('csv').onclick=()=>{const rows=[['店舗','日付','スタッフ','開始','終了','休憩分']];const name=stores.find(s=>s.id===$('store').value)?.name||'';for(const s of staff)for(const v of shifts.filter(x=>x.staff_id===s.id))rows.push([name,v.work_date,s.name,v.start_time||'',v.end_time||'',v.break_minutes]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='shift-'+$('month').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
check();
</script></html>

<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薬局シフト管理</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#243247;margin:0}header{background:#fff;padding:18px 5%;border-bottom:1px solid #dce2eb}main{max-width:1200px;margin:auto;padding:22px}h1{margin:0;font-size:22px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}select,input,button{font:inherit;padding:9px;border:1px solid #ccd5e1;border-radius:8px;background:white}button{cursor:pointer;background:#244c80;color:white}section{background:white;border:1px solid #e1e6ed;border-radius:12px;padding:16px;overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{border:1px solid #e2e7ef;padding:6px;text-align:center}th:first-child,td:first-child{position:sticky;left:0;background:#fff;z-index:1}td input{width:77px;padding:5px}td input[type=number]{width:52px}small{color:#68778d}.staff{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.warn{color:#a23b38} .sum{font-weight:700}</style></head><body><header><h1>薬局シフト管理</h1><small>勤務時間入力型・開発用デモ（この端末にのみ保存）</small></header><main><div class="toolbar"><label>店舗 <select id="store"></select></label><label>対象月 <input type="month" id="month"></label><button id="export">CSV出力</button></div><section><h2 id="heading"></h2><div class="staff"><input id="name" placeholder="スタッフ名（仮名推奨）"><button id="add">スタッフ追加</button></div><div id="table"></div><p id="message" class="warn"></p></section></main><script>
const stores=['パンジー調剤薬局','ダリア調剤薬局','レモン調剤薬局',...Array.from({length:13},(_,i)=>`店舗${i+4}（仮）`)];const $=id=>document.getElementById(id);const state=JSON.parse(localStorage.getItem('pharmacy-shift-demo-v1')||'{"staff":{},"shifts":{}}');const save=()=>localStorage.setItem('pharmacy-shift-demo-v1',JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));stores.forEach((s,i)=>$('store').add(new Option(s,String(i))));$('month').value=new Date().toLocaleDateString('sv-SE').slice(0,7);function key(){return `${$('store').value}|${$('month').value}`}function minutes(t){if(!/^\d{2}:\d{2}$/.test(t))return null;let [h,m]=t.split(':').map(Number);return h<24&&m<60?h*60+m:null}function duration(v){if(!v?.start||!v?.end)return 0;let a=minutes(v.start),b=minutes(v.end);if(a===null||b===null||b<=a||Number(v.break)<0||b-a<Number(v.break||0))return NaN;return b-a-Number(v.break||0)}function render(){const k=key(),[y,m]=$('month').value.split('-').map(Number),days=new Date(y,m,0).getDate(),staff=state.staff[$('store').value]||[];if(!state.shifts[k])state.shifts[k]={};$('heading').textContent=`${stores[Number($('store').value)]}・${y}年${m}月`;$('table').innerHTML='<table><thead><tr><th>スタッフ</th>'+Array.from({length:days},(_,i)=>`<th>${i+1}日</th>`).join('')+'<th>実働合計</th></tr></thead><tbody>'+staff.map((s,idx)=>{let sum=0;const cells=Array.from({length:days},(_,i)=>{let d=i+1,v=state.shifts[k][`${idx}:${d}`]||{},n=duration(v);if(!Number.isNaN(n))sum+=n;return `<td><input aria-label="${esc(s)} ${d}日 開始" type="time" data-i="${idx}" data-d="${d}" data-f="start" value="${esc(v.start||'')}"><input aria-label="${esc(s)} ${d}日 終了" type="time" data-i="${idx}" data-d="${d}" data-f="end" value="${esc(v.end||'')}"><input aria-label="${esc(s)} ${d}日 休憩分" type="number" min="0" max="1440" step="5" data-i="${idx}" data-d="${d}" data-f="break" value="${esc(v.break??60)}" title="休憩（分）"></td>`}).join('');return `<tr><th>${esc(s)}</th>${cells}<td class="sum">${(sum/60).toFixed(2)}h</td></tr>`}).join('')+'</tbody></table>';$('message').textContent='※デモ版です。複数端末との同期・ログイン・権限制御は未実装。実名や実際の勤務データは入力しないでください。'}$('add').onclick=()=>{const n=$('name').value.trim();if(!n)return;const s=state.staff[$('store').value]||[];if(s.includes(n)){alert('同じ名前が登録されています');return}s.push(n);state.staff[$('store').value]=s;save();$('name').value='';render()};$('table').addEventListener('change',e=>{const x=e.target;if(!x.matches('[data-f]'))return;const k=key(),id=`${x.dataset.i}:${x.dataset.d}`;state.shifts[k][id]??={};state.shifts[k][id][x.dataset.f]=x.value;save();render()});$('store').onchange=render;$('month').onchange=render;$('export').onclick=()=>{const k=key(),staff=state.staff[$('store').value]||[],[y,m]=$('month').value.split('-').map(Number),days=new Date(y,m,0).getDate(),rows=[['店舗','月','スタッフ','日','開始','終了','休憩分','実働時間']];staff.forEach((s,i)=>{for(let d=1;d<=days;d++){let v=state.shifts[k]?.[`${i}:${d}`]||{},n=duration(v);rows.push([stores[Number($('store').value)],$('month').value,s,d,v.start||'',v.end||'',v.break??'',Number.isNaN(n)?'不正':(n/60).toFixed(2)])}});const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`shift-${k.replace('|','-')}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>17店舗シフト管理</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;color:#223047;margin:0}header{background:white;padding:16px 4%;border-bottom:1px solid #ddd}main{max-width:1300px;margin:auto;padding:20px}section{background:white;border:1px solid #dce3ec;border-radius:12px;padding:18px;margin:12px 0}input,select,button{font:inherit;padding:9px;border:1px solid #ccd5e0;border-radius:7px;margin:4px}button{background:#215a9c;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}table{border-collapse:collapse;white-space:nowrap}td,th{border:1px solid #dce3ec;padding:5px;text-align:center}th:first-child{position:sticky;left:0;background:#fff}td input{width:100px;box-sizing:border-box;font-size:12px}td input[type=number]{width:60px}#grid{overflow:auto;max-height:70vh}small,.muted{color:#64748b}.error{color:#a22}#login{max-width:400px;margin:60px auto}#login input{display:block;width:90%}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style><header><b>薬局17店舗 シフト管理</b> <small>共有データベース版</small></header><main><section id="login" hidden><h2>店舗ログイン</h2><p class="muted">店舗専用IDとパスワードでログインしてください。アカウント発行完了までは利用できません。</p><input id="email" type="text" placeholder="店舗ログインID（例：dahlia）" autocomplete="username"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="signin">ログイン</button><p id="loginmsg" class="error"></p></section><div id="app"><div class="row"><label>店舗 <select id="store"></select></label><label>対象月 <input id="month" type="month"></label><button id="reload">更新</button><button id="unlock">編集を有効にする</button><button id="csv">CSV出力</button><button id="logout">ログアウト</button></div><section><h2 id="heading"></h2><div class="row"><input id="staffname" placeholder="スタッフ名"><select id="role"><option>薬剤師</option><option>事務</option><option>その他</option></select><button id="add">スタッフ登録</button></div><p id="notice" role="status">ログイン不要の閲覧版です。編集機能は準備中です。</p><div id="grid"></div></section></div></main><script>
const API='https://fgwowahsuxrtyrlbymeb.supabase.co/functions/v1/shift-public-api';
const $=id=>document.getElementById(id);let stores=[],staff=[],shifts=[],revision=0,passcode=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('month').value=new Date().toLocaleDateString('sv-SE').slice(0,7);
async function api(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'通信に失敗しました');return j}
function msg(t,bad=false){$('notice').textContent=t;$('notice').className=bad?'error':''}
async function init(){try{const x=await api({action:'stores'});stores=x.stores;$('store').replaceChildren(...stores.map(s=>new Option(s.name,s.id)));await load()}catch(e){msg('店舗一覧を取得できません: '+e.message,true)}}
async function load(){const v=++revision,store=$('store').value,month=$('month').value;if(!store||!month)return;msg('読み込み中…');try{const x=await api({action:'schedule',store_id:store,month});if(v!==revision)return;staff=x.staff;shifts=x.shifts;render();msg(passcode?'編集可能です。変更は入力欄を離れると保存されます。':'閲覧モード：編集する場合は「編集を有効にする」を押してください。')}catch(e){msg('読み込みに失敗しました: '+e.message,true)}}
function render(){const store=stores.find(s=>s.id===$('store').value),month=$('month').value,[y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate();$('heading').textContent=(store?.name||'')+' / '+y+'年'+m+'月';$('add').disabled=!passcode;$('staffname').disabled=!passcode;$('role').disabled=!passcode;const map=new Map(shifts.map(x=>[x.staff_id+'|'+x.work_date,x]));let h='<table><thead><tr><th>スタッフ</th>';for(let d=1;d<=days;d++)h+='<th>'+d+'日</th>';h+='<th>実働合計</th></tr></thead><tbody>';for(const s of staff){h+='<tr><th>'+esc(s.name)+' <small>'+esc(s.role)+'</small></th>';let sum=0;for(let d=1;d<=days;d++){const date=month+'-'+String(d).padStart(2,'0'),v=map.get(s.id+'|'+date),start=v?.start_time?.slice(0,5)||'',end=v?.end_time?.slice(0,5)||'',br=v?.break_minutes??60;const mins=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};if(start&&end&&mins(end)>=mins(start)+br)sum+=mins(end)-mins(start)-br;h+='<td><input disabled aria-label="'+esc(s.name+' '+d+'日開始')+'" type="time" value="'+esc(start)+'"><input disabled aria-label="'+esc(s.name+' '+d+'日終了')+'" type="time" value="'+esc(end)+'"><input disabled type="number" value="'+esc(br)+'" title="休憩（分）"></td>'}h+='<td>'+ (sum/60).toFixed(2)+'h</td></tr>'}h+='</tbody></table>';$('grid').innerHTML=h}
$('store').onchange=load;$('month').onchange=load;$('reload').onclick=load;$('logout').hidden=true;
$('csv').onclick=()=>{const rows=[['店舗','日付','スタッフ','開始','終了','休憩分']];const name=stores.find(s=>s.id===$('store').value)?.name||'';for(const s of staff)for(const v of shifts.filter(x=>x.staff_id===s.id))rows.push([name,v.work_date,s.name,v.start_time||'',v.end_time||'',v.break_minutes]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='shift-'+$('month').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('unlock').onclick=async()=>{const p=prompt('共通編集パスコードを入力してください');if(!p)return;try{await api({action:'verify',passcode:p});passcode=p;render();msg('編集モードになりました。')}catch(e){msg(e.message,true)}};
$('add').onclick=async()=>{if(!passcode)return;const name=$('staffname').value.trim();if(!name)return;try{await api({action:'add_staff',passcode,store_id:$('store').value,name,role:$('role').value});$('staffname').value='';await load()}catch(e){msg(e.message,true)}};
$('grid').addEventListener('change',async e=>{const x=e.target;if(!passcode||!x.dataset.field)return;const sid=x.dataset.staff,date=x.dataset.date,old=shifts.find(s=>s.staff_id===sid&&s.work_date===date),start=old?.start_time?.slice(0,5)||null,end=old?.end_time?.slice(0,5)||null;const vals={start_time:start,end_time:end,break_minutes:old?.break_minutes??60};vals[x.dataset.field]=x.dataset.field==='break_minutes'?Number(x.value):(x.value||null);if((vals.start_time===null)!==(vals.end_time===null)){msg('開始と終了の両方を入力すると保存します。');return}try{await api({action:'save_shift',passcode,store_id:$('store').value,staff_id:sid,date,expected_updated_at:old?.updated_at||null,...vals});await load()}catch(e){msg(e.message,true)}});
init();
</script></html>

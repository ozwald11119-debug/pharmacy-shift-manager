<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>17店舗シフト管理</title><style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f3f5f8;color:#243042;margin:0}header{background:#fff;border-bottom:1px solid #d9e0e8;padding:14px 20px}main{max-width:100%;padding:12px}section{background:white;border:1px solid #dce3eb;border-radius:10px;padding:14px;margin:10px 0}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:6px;padding:8px;margin:3px}button{background:#245b92;color:white;cursor:pointer}button:disabled{opacity:.45}#grid{overflow:auto;max-height:75vh;border:1px solid #d9e1e9}table{border-collapse:separate;border-spacing:0;white-space:nowrap;font-size:13px}td,th{border-right:1px solid #dce3eb;border-bottom:1px solid #dce3eb;text-align:center;padding:5px 3px;min-width:62px}thead th{position:sticky;top:0;background:#edf3f9;z-index:2}thead tr:nth-child(2) th{top:29px;background:#f7f9fc}th:first-child{position:sticky;left:0;min-width:116px;max-width:116px;background:#fff;z-index:3}thead th:first-child{z-index:5;background:#e6eff8}td input{width:68px;box-sizing:border-box;font-size:13px;padding:5px 2px;margin:0;border:1px solid transparent;background:transparent;text-align:center}td input:focus{background:#fff;border-color:#397ac3;outline:2px solid #bcd9fa}td input:disabled{opacity:1;color:#475569}td input[type=number]{width:50px}.weekend{background:#fff3f3}.sat{background:#f0f6ff}.hours{background:#f6f8fb;font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}small,.muted{color:#64748b}.error{color:#b42318}#login{display:none!important}#heading{margin:4px 0 10px;font-size:18px}#notice{font-size:13px}#unlock{background:#1d754f}
</style><header><b>薬局17店舗 シフト管理</b> <small>共有データベース版</small></header><main><section id="login" hidden><h2>店舗ログイン</h2><p class="muted">店舗専用IDとパスワードでログインしてください。アカウント発行完了までは利用できません。</p><input id="email" type="text" placeholder="店舗ログインID（例：dahlia）" autocomplete="username"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button id="signin">ログイン</button><p id="loginmsg" class="error"></p></section><div id="app"><div class="row"><label>店舗 <select id="store"></select></label><label>対象月 <input id="month" type="month"></label><button id="reload">更新</button><button id="unlock">編集を有効にする</button><button id="csv">CSV出力</button><button id="logout">ログアウト</button></div><section><h2 id="heading"></h2><div class="row"><input id="staffname" placeholder="氏名を入力して行を追加"><select id="role"><option>薬剤師</option><option>事務</option><option>その他</option></select><button id="add">スタッフ登録</button></div><p id="notice" role="status">ログイン不要の閲覧版です。編集機能は準備中です。</p><div id="grid"></div></section></div></main><script>
const API='https://fgwowahsuxrtyrlbymeb.supabase.co/functions/v1/shift-public-api';
const $=id=>document.getElementById(id);let stores=[],staff=[],shifts=[],revision=0,passcode=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('month').value=new Date().toLocaleDateString('sv-SE').slice(0,7);
async function api(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||'通信に失敗しました');return j}
function msg(t,bad=false){$('notice').textContent=t;$('notice').className=bad?'error':''}
async function init(){try{const x=await api({action:'stores'});stores=x.stores;$('store').replaceChildren(...stores.map(s=>new Option(s.name,s.id)));await load()}catch(e){msg('店舗一覧を取得できません: '+e.message,true)}}
async function load(){const v=++revision,store=$('store').value,month=$('month').value;if(!store||!month)return;msg('読み込み中…');try{const x=await api({action:'schedule',store_id:store,month});if(v!==revision)return;staff=x.staff;shifts=x.shifts;render();msg(passcode?'編集可能です。変更は入力欄を離れると保存されます。':'閲覧モード：編集する場合は「編集を有効にする」を押してください。')}catch(e){msg('読み込みに失敗しました: '+e.message,true)}}
function render(){const store=stores.find(s=>s.id===$('store').value),month=$('month').value,[y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate();$('heading').textContent=(store?.name||'')+'　'+y+'年'+m+'月';$('add').disabled=!passcode;$('staffname').disabled=!passcode;$('role').disabled=!passcode;const map=new Map(shifts.map(x=>[x.staff_id+'|'+x.work_date,x]));let h='<table><thead><tr><th rowspan="2">氏名</th>';for(let d=1;d<=days;d++){const day=new Date(y,m-1,d).getDay(),cl=day===0?'weekend':day===6?'sat':'';h+='<th colspan="3" class="'+cl+'">'+d+'日（'+'日月火水木金土'[day]+'）</th>'}h+='<th rowspan="2">月間実働</th></tr><tr>';for(let d=1;d<=days;d++)h+='<th>始業</th><th>終業</th><th>勤務時数</th>';h+='</tr></thead><tbody>';for(const s of staff){h+='<tr><th>'+esc(s.name)+'</th>';let sum=0;for(let d=1;d<=days;d++){const date=month+'-'+String(d).padStart(2,'0'),v=map.get(s.id+'|'+date),start=v?.start_time?.slice(0,5)||'',end=v?.end_time?.slice(0,5)||'',br=v?.break_minutes??60;const mins=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1]};let hours='';if(start&&end&&mins(end)>=mins(start)+br){const n=mins(end)-mins(start)-br;sum+=n;hours=(n/60).toFixed(2)}const day=new Date(y,m-1,d).getDay(),cl=day===0?'weekend':day===6?'sat':'';for(const [field,val] of [['start_time',start],['end_time',end]])h+='<td class="'+cl+'"><input '+(!passcode?'disabled ':'')+'data-staff="'+s.id+'" data-date="'+date+'" data-field="'+field+'" type="time" value="'+esc(val)+'" aria-label="'+esc(s.name+' '+d+'日 '+field)+'"></td>';h+='<td class="hours '+cl+'" title="休憩'+br+'分">'+hours+'</td>'}h+='<td class="hours">'+(sum/60).toFixed(2)+'h</td></tr>'}h+='</tbody></table>';$('grid').innerHTML=h;if(!staff.length)msg('スタッフ未登録です。「編集を有効にする」→パスコード入力→氏名を入力してスタッフ登録してください。')}
$('store').onchange=load;$('month').onchange=load;$('reload').onclick=load;$('logout').hidden=true;
$('csv').onclick=()=>{const rows=[['店舗','日付','スタッフ','開始','終了','休憩分']];const name=stores.find(s=>s.id===$('store').value)?.name||'';for(const s of staff)for(const v of shifts.filter(x=>x.staff_id===s.id))rows.push([name,v.work_date,s.name,v.start_time||'',v.end_time||'',v.break_minutes]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='shift-'+$('month').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('unlock').onclick=async()=>{const p=prompt('共通編集パスコードを入力してください');if(!p)return;try{await api({action:'verify',passcode:p});passcode=p;render();msg('編集モードです。スタッフ登録後、始業・終業を入力できます。休憩時間は現在60分固定です。')}catch(e){msg(e.message,true)}};
$('add').onclick=async()=>{if(!passcode)return;const name=$('staffname').value.trim();if(!name)return;try{await api({action:'add_staff',passcode,store_id:$('store').value,name,role:$('role').value});$('staffname').value='';await load()}catch(e){msg(e.message,true)}};
$('grid').addEventListener('change',async e=>{const x=e.target;if(!passcode||!x.dataset.field)return;const sid=x.dataset.staff,date=x.dataset.date,old=shifts.find(s=>s.staff_id===sid&&s.work_date===date),start=old?.start_time?.slice(0,5)||null,end=old?.end_time?.slice(0,5)||null;const vals={start_time:start,end_time:end,break_minutes:old?.break_minutes??60};for(const field of ['start_time','end_time']){const input=Array.from($('grid').querySelectorAll('input[data-staff]')).find(el=>el.dataset.staff===sid&&el.dataset.date===date&&el.dataset.field===field);if(input)vals[field]=field==='break_minutes'?Number(input.value):(input.value||null)};if((vals.start_time===null)!==(vals.end_time===null)){msg('開始と終了の両方を入力すると保存します。');return}try{await api({action:'save_shift',passcode,store_id:$('store').value,staff_id:sid,date,expected_updated_at:old?.updated_at||null,...vals});await load()}catch(e){msg(e.message,true)}});
init();
</script></html>
